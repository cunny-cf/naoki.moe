<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 – Out of bounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#141a2e; --grid:#2c3a63; --panel:#1c2442; --text:#e9edf8; --muted:#9aa6c9; --accent:#ff3fd8; --edge:#34426f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --void:#dfe9f6; --grid:#b4c6e2; --panel:#f6f9ff; --text:#16203a; --muted:#51608a; --accent:#d4169f; --edge:#b4c6e2;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --void:#dfe9f6; --grid:#b4c6e2; --panel:#f6f9ff; --text:#16203a; --muted:#51608a; --accent:#d4169f; --edge:#b4c6e2; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:grid; place-items:center; overflow:hidden;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--void); color:var(--text); line-height:1.6;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px; background-position:center top;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 35%,transparent 0%,var(--void) 75%);
}
main{position:relative; width:100%; max-width:560px; padding:24px 20px; text-align:left}

.code{
  display:flex; font-size:clamp(5.5rem,30vw,10rem); font-weight:800;
  line-height:.9; letter-spacing:-.05em; margin:0 0 24px;
}
.code span{display:block}
.code .o{
  color:transparent; -webkit-text-stroke:3px var(--text);
  animation:fall 5s cubic-bezier(.5,0,.9,.6) infinite;
}
@keyframes fall{
  0%,18%{transform:translateY(0); opacity:1}
  70%{transform:translateY(70vh) rotate(24deg); opacity:0}
  71%{transform:translateY(-30vh) rotate(0); opacity:0}
  88%,100%{transform:translateY(0); opacity:1}
}
h1{font-size:clamp(1.5rem,6vw,2rem); font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0 0 10px}
p{margin:0 0 6px; font-size:1.05rem; max-width:44ch}
.muted{color:var(--muted)}
a.back{
  display:inline-block; margin-top:22px; padding:11px 22px; border-radius:999px;
  background:var(--accent); color:#fff; font-weight:600; text-decoration:none; transition:transform .15s;
}
a.back:hover{transform:scale(1.04)}
a.back:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .code .o{animation:none}
  a.back{transition:none}
}
</style>
</head>
<body>
<main>
  <div class="code" aria-label="404"><span>4</span><span class="o">0</span><span>4</span></div>
  <h1>Hey, you aren’t supposed to be here.</h1>
  <p>Trying to go out of bounds yourself?</p>
  <p class="muted">You clipped through the map and landed on a page that doesn’t exist. Nice try though.</p>
  <a class="back" href="/">Respawn at the start</a>
</main>
</body>
</html>
