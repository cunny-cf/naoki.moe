<style>
:root{
  --void:#141a2e; --grid:#2c3a63; --panel:#1c2442; --panel-hi:#252f55;
  --text:#e9edf8; --muted:#9aa6c9; --accent:#ff3fd8; --edge:#34426f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --void:#dfe9f6; --grid:#b4c6e2; --panel:#f6f9ff; --panel-hi:#ffffff;
    --text:#16203a; --muted:#51608a; --accent:#d4169f; --edge:#b4c6e2;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --void:#dfe9f6; --grid:#b4c6e2; --panel:#f6f9ff; --panel-hi:#ffffff;
  --text:#16203a; --muted:#51608a; --accent:#d4169f; --edge:#b4c6e2; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--void); color:var(--text); line-height:1.6;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;
  background-position:center top;
  -webkit-mask-image:none;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,transparent 0%,var(--void) 75%);
}
main{position:relative; max-width:560px; margin:0 auto; padding:56px 20px 48px}

.hero h1{
  font-size:clamp(3.2rem,16vw,5.4rem); font-weight:800; line-height:.95;
  letter-spacing:-.04em; margin:0 0 20px;
}
.hero h1 span{display:inline-block; transform:translateX(.12em); color:transparent;
  -webkit-text-stroke:2px var(--text); }
.about{margin:0 0 36px; color:var(--text); font-size:1.05rem; max-width:46ch}
.about p{margin:0 0 .8em}
.about .note{color:var(--muted)}

.links{list-style:none; margin:0 0 44px; padding:0; display:grid; gap:10px}
.links a{
  display:flex; align-items:center; gap:16px; padding:14px 18px;
  background:var(--panel); border:1px solid var(--edge); border-radius:14px;
  color:var(--text); text-decoration:none;
  transition:background .15s, border-color .15s, transform .15s;
}
.links a:hover{background:var(--panel-hi); border-color:var(--accent); transform:translateX(4px)}
.links a:focus-visible,.kofi a:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.links svg{width:28px; height:28px; flex:none; fill:currentColor}
.links .name{display:block; font-weight:600; line-height:1.2}
.links .handle{display:block; color:var(--muted); font-size:.95rem; line-height:1.3}

.kofi{
  padding:22px; border-radius:14px; text-align:center;
  background:var(--panel); border:1px solid var(--edge);
  background-image:conic-gradient(var(--accent) 25%,transparent 0 50%,var(--accent) 0 75%,transparent 0);
  background-size:12px 12px; background-repeat:repeat-x; background-position:left top;
  padding-top:30px;
}
.kofi p{margin:0 0 16px; color:var(--text)}
.kofi a{
  display:inline-flex; align-items:center; gap:10px; padding:11px 22px;
  border-radius:999px; background:var(--accent); color:#fff; font-weight:600;
  text-decoration:none; transition:transform .15s;
}
.kofi a:hover{transform:scale(1.04)}
.kofi svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.latest{margin:0 0 44px}
.latest h2{font-size:1.15rem; font-weight:600; margin:0 0 12px}
.latest .frame{position:relative; aspect-ratio:16/9; border:1px solid var(--edge); border-radius:14px; overflow:hidden; background:var(--panel)}
.latest iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
